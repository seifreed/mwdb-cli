[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mwdb-cli"
version = "0.1.0"
description = "CLI and Python client library covering the full MWDB Core API"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Marc Rivero", email = "marc.rivero@blackdogs.io" }]
keywords = ["mwdb", "malware", "threat-intelligence", "cert-pl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28",
    "click>=8.1",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/seifreed/mwdb-cli"

[project.scripts]
mwdb = "mwdb_cli.cli:main"

[dependency-groups]
dev = [
    "black>=25.1",
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mwdb_cli"]

[tool.black]
target-version = ["py314"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
strict = true
python_version = "3.14"
exclude = ["venv"]

[tool.bandit]
exclude_dirs = ["venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=mwdb_cli --cov-branch --cov-fail-under=100"

[tool.coverage.run]
source = ["mwdb_cli"]

[tool.coverage.report]
show_missing = true
